[package]
edition = "2021"
name = "lightningrodlabs_we-rust-utils"
version = "0.601.2"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.2.2", default-features = false, features = [
  "napi4",
  "tokio_rt",
  "async",
  "serde-json",
] }
napi-derive = "3.2.2"

holochain_types = "0.6.1"
lair_keystore_api = "0.6.3"

futures = "0.3"
hex = "0.4.3"
nanoid = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.132"
serde_yaml = "0.8"
sha2 = "0.10.8"
url = "2.2"
url2 = "0.0.6"
zip = "0.5.0"

# For computing the legacy (pre-`relay_url` rename) happ sha256 by round-tripping
# the bundle via a schema-agnostic representation (preserves original manifest
# field names, e.g. `signal_url`).
flate2 = "1.0"
rmp-serde = "=1.3.0"
rmpv = { version = "1.3", features = ["with-serde"] }
serde_bytes = "0.11"

[build-dependencies]
napi-build = "2.0.1"

[profile.release]
lto = true
