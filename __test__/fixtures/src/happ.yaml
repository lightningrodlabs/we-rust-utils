manifest_version: '0'
name: fixture-app
description: Fixture for hash regression tests
roles:
  - name: fixture
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: fixture.dna
      modifiers:
        network_seed: role-seed
        properties:
          role_prop: value
      installed_hash: ~
      clone_limit: 3
allow_deferred_memproofs: false
bootstrap_url: https://bootstrap.example.invalid
relay_url: https://relay.example.invalid
